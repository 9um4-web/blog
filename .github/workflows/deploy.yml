name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 깃허브 저장소 코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🚀 [시작 시] 빌드 및 배포 프로세스 시작 알림 전송 (Discord & Telegram)
      - name: Alert Build & Deploy Start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 커밋 메시지는 외부(사용자) 입력이라 run: 스크립트 문자열에 ${{ }}로 직접 넣으면
          # 스크립트 인젝션 위험이 있다 — env로 넘겨서 셸이 값 그대로(코드로 안 해석) 쓰게 한다.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          source .github/scripts/notify.sh

          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          COMMIT_MSG_LINE="$(head -n1 <<< "$COMMIT_MESSAGE")"

          discord_embed "🚀 빌드 및 배포 시작 (Build & Deploy Started)" \
            "GitHub Actions에서 블로그 빌드 검증 및 배포 과정을 시작합니다.\nCommit: [\`${SHORT_SHA}\`](${COMMIT_URL}) - ${COMMIT_MSG_LINE}" \
            3447003
          telegram_text "🚀 *빌드 및 배포 시작 (Build & Deploy Started)*\n\nGitHub Actions에서 블로그 빌드 검증 및 배포 과정을 시작합니다.\n\nCommit: [\`${SHORT_SHA}\`](${COMMIT_URL}) - ${COMMIT_MSG_LINE}"

      # 2. Node.js 빌드 환경 셋업 및 빌드 검증
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@gogum4"

      # 에디터 패키지(@gogum4/editor-*)는 다른 조직의 GitHub Packages라 `read:packages` 권한의 토큰(저장소 비밀 GH_PACKAGES_TOKEN)이 필요하다.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # 여기서 빌드가 실패하면 다음 단계로 가지 않고 멈춤
      - name: Build Test
        run: npm run build > build_log.txt 2>&1

      # ❌ [빌드 실패 시] 디스코드 & 텔레그램 알림 및 로그 파일 업로드
      - name: Alert Build Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source .github/scripts/notify.sh

          # 1. 텔레그램 단문 상태 알림
          telegram_text "❌ <b>빌드 실패 (Build Error)</b>\nGitHub Actions 빌드 검증 중 에러가 발생했습니다. (디스코드에서 상세 로그 파일 확인 요망)" "HTML"

          # 2. 디스코드 배포 실패 기본 알림
          discord_embed "❌ 배포 실패 (Deploy Failed)" "도커 이미지 빌드가 비정상 중단되었습니다. (상세 내역은 아래 로그 카드를 참고하세요)" 16711680

          # 3. 디스코드 에러 요약본 (마지막 15줄)
          SUMMARY=$(tail -n 15 build_log.txt)
          discord_embed "❌ 빌드 실패 상세 내역 (Build Error Detail)" "**에러 요약:**\n\`\`\`bash\n${SUMMARY}\n\`\`\`" 16711680

          # 4. 전체 빌드 로그 파일 업로드
          discord_file build_log.txt

      # 🐳 Docker Buildx 및 로그인 설정 (빌드 통과 시만 실행)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🐳 blog-app 이미지 빌드 및 GHCR에 푸시
      - name: Build and push blog-app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          secrets: |
            npmrc=//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}
          push: true
          tags: |
            ghcr.io/9um4-web/blog-app:latest
            ghcr.io/9um4-web/blog-app:${{ github.sha }}

      # 🔍 blog-app 이미지에 시크릿/취약점이 섞여 들어가지 않았는지 검사.
      # GHCR public 전환을 전제로 두는 안전장치라 매 빌드마다 자동 실행한다.
      # exit-code는 우선 0(경고만)으로 시작 — 오탐 없이 안정화되면 1로 올려서 실패 처리할 것.
      - name: Scan blog-app image (secrets & vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/9um4-web/blog-app:${{ github.sha }}
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # 🐳 blog-migrate 이미지 빌드 및 GHCR에 푸시
      - name: Build and push blog-migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: build
          secrets: |
            npmrc=//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}
          push: true
          tags: |
            ghcr.io/9um4-web/blog-migrate:latest
            ghcr.io/9um4-web/blog-migrate:${{ github.sha }}

      # 🔍 blog-migrate 이미지도 동일하게 검사 (build 스테이지라 소스/의존성 전체를 포함하므로 더 중요)
      - name: Scan blog-migrate image (secrets & vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/9um4-web/blog-migrate:${{ github.sha }}
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # 3. [빌드 통과 시] 서버의 self-hosted 러너에 배포를 맡긴다.
      #
      # 이 공개 저장소의 워크플로(fork PR 포함)가 서버에서 직접 돌지 않게, 서버 러너는 별도 비공개 저장소
      # (9um4/blog-deploy-trigger)에만 등록돼 있고 이 단계는 그 저장소에 `repository_dispatch` 이벤트만 보낸다.
      # 이 단계는 `push: main`(저장소 소유자만 가능)에서만 도달하며, 서버에서 일어나는 일(git reset·docker compose pull/up·알림)은
      # 서버의 ~/blog-deploy/deploy-with-notify.sh가 맡는다(그 저장소의 README 참고).
      # 토큰(DEPLOY_TRIGGER_TOKEN)은 9um4/blog-deploy-trigger 한 곳에만 권한을 둔 fine-grained PAT(Contents: write)이다.
      - name: Trigger deploy on self-hosted runner
        id: trigger_deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          # 커밋 메시지는 외부 입력이라 env로 넘겨 셸이 값 그대로 쓰게 한다.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh api repos/9um4/blog-deploy-trigger/dispatches \
            -f event_type=deploy-blog \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[message]=$(head -n1 <<< "$COMMIT_MESSAGE")"

      # ❌ [배포 트리거 전송 실패 시] 경고 전송
      # ⚠️ failure()를 더해 이전 단계가 실패 상태더라도 이 경고 단계가 강제 실행되도록 보장했습니다.
      - name: Alert Server Connection Failure
        if: failure() && steps.trigger_deploy.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source .github/scripts/notify.sh
          discord_embed "⚠️ 배포 트리거 실패" "빌드는 끝났지만 서버 러너에 배포 이벤트를 보내지 못했습니다. (DEPLOY_TRIGGER_TOKEN 만료·권한 확인)" 16753920
          telegram_text "⚠️ *배포 트리거 실패*\n\n빌드는 끝났지만 서버 러너에 배포 이벤트를 보내지 못했습니다. (DEPLOY_TRIGGER_TOKEN 만료·권한 확인)"